function haversineKm(lat1, lng1, lat2, lng2) {
var R = 6371;
var dLat = (lat2 - lat1) * Math.PI / 180;
var dLng = (lng2 - lng1) * Math.PI / 180;
var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
Math.sin(dLng/2) * Math.sin(dLng/2);
var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
return R * c;
}

function TrackingMap(props) {
var mapRef = React.useRef(null);
var mapObjRef = React.useRef(null);
var riderMarkerRef = React.useRef(null);
var [riderPos, setRiderPos] = React.useState(null);

React.useEffect(function() {
if (!mapRef.current || mapObjRef.current) return;
var center = props.restaurantLatLng || props.addressLatLng || { lat: 8.178, lng: 77.428 };
var map = L.map(mapRef.current).setView([center.lat, center.lng], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
if (props.restaurantLatLng) {
L.marker([props.restaurantLatLng.lat, props.restaurantLatLng.lng]).addTo(map).bindPopup('🏪 ஹோட்டல்');
}
if (props.addressLatLng) {
L.marker([props.addressLatLng.lat, props.addressLatLng.lng]).addTo(map).bindPopup('🏠 உங்க முகவரி');
}
mapObjRef.current = map;
setTimeout(function() { map.invalidateSize(); }, 200);
}, []);

React.useEffect(function() {
if (!props.riderId) return;
function fetchPos() {
supabase.from("riders").select("current_lat, current_lng").eq("id", props.riderId).then(function(res) {
if (res.data && res.data[0] && res.data[0].current_lat) {
setRiderPos({ lat: res.data[0].current_lat, lng: res.data[0].current_lng });
}
});
}
fetchPos();
var channel = supabase.channel('rider-pos-' + props.riderId)
.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'riders', filter: 'id=eq.' + props.riderId }, function(payload) {
if (payload.new.current_lat) setRiderPos({ lat: payload.new.current_lat, lng: payload.new.current_lng });
}).subscribe();
return function() { supabase.removeChannel(channel); };
}, [props.riderId]);

React.useEffect(function() {
if (!riderPos || !mapObjRef.current) return;
if (riderMarkerRef.current) {
riderMarkerRef.current.setLatLng([riderPos.lat, riderPos.lng]);
} else {
var bikeIcon = L.divIcon({ html: '🏍️', className: '', iconSize: [24, 24] });
riderMarkerRef.current = L.marker([riderPos.lat, riderPos.lng], { icon: bikeIcon }).addTo(mapObjRef.current).bindPopup('🏍️ Rider');
}
mapObjRef.current.panTo([riderPos.lat, riderPos.lng]);
}, [riderPos]);

return e('div', { style: { marginTop: 12 } },
e('div', { ref: mapRef, style: { width: '100%', height: 220, borderRadius: 16, border: '1px solid #EEE0C8', overflow: 'hidden' } }),
props.riderId && !riderPos ? e('p', { style: { fontSize: 11, color: '#8A6D3B', textAlign: 'center', marginTop: 6 } }, 'Rider location தேடுறோம்...') : null
);
}

function captureLocation(opts) {
opts = opts || {};
var isNew = !!opts.isNew;
if (!navigator.geolocation) { setGpsErr("இந்த browser-ல் Location ஆதரவு இல்லை"); return; }
setGpsBusy(true); setGpsErr("");

function onSuccess(pos) {
var lat = pos.coords.latitude, lng = pos.coords.longitude;
fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng)
.then(function(r) { return r.json(); })
.then(function(geo) {
var text = (geo && geo.display_name) ? geo.display_name : (lat.toFixed(5) + ", " + lng.toFixed(5));
var pin = (geo && geo.address && geo.address.postcode) ? geo.address.postcode : null;
var payload = { customer_id: session.user.id, label: isNew ? (newLabel || "Home") : "Home", full_address: text, latitude: lat, longitude: lng, pincode: pin };
if (isNew) { payload.recipient_name = newRecipientName || null; payload.recipient_phone = newRecipientPhone || null; }
var op = (addressId && !isNew)
? supabase.from("addresses").update(payload).eq("id", addressId).select()
: supabase.from("addresses").insert(payload).select();
op.then(function(res) {
setGpsBusy(false);
if (res.error) { setGpsErr(res.error.message); return; }
if (res.data && res.data[0]) {
var saved = res.data[0];
setAddresses(function(prev) { return isNew ? prev.concat([saved]) : prev.map(function(a){ return a.id === saved.id ? saved : a; }); });
setAddressId(saved.id);
setAddressText(text);
setAddressLatLng({ lat: lat, lng: lng });
setAddressPincode(pin);
if (isNew) { setAddrFormOpen(false); setNewLabel("Home"); setNewRecipientName(""); setNewRecipientPhone(""); setScreen('menu'); }
}
});
}).catch(function() {
setGpsBusy(false); setGpsErr("Address தேட முடியல, ஆனா location கிடைச்சது");
setAddressLatLng({ lat: lat, lng: lng });
});
}

function onError(err) {
if (err.code === 3) {
navigator.geolocation.getCurrentPosition(onSuccess, function(err2) {
setGpsBusy(false);
setGpsErr(describeError(err2));
}, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
return;
}
setGpsBusy(false);
setGpsErr(describeError(err));
}

function describeError(err) {
if (err.code === 1) return "Location அனுமதி கொடுங்க (browser settings-ல் Allow பண்ணுங்க)";
if (err.code === 2) return "Location கிடைக்கல் — GPS/Location service on பண்ணுங்க";
if (err.code === 3) return "Location எடுக்க நேரம் ஆகுது — திறந்த வெளியில் மறுபடி try பண்ணுங்க";
return "Location error: " + err.message;
}

navigator.geolocation.getCurrentPosition(onSuccess, onError, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

function addItem(id) { setCart(function(c) { var n = Object.assign({}, c); n[id] = (n[id] || 0) + 1; return n; }); }
function removeItem(id) { setCart(function(c) { var n = Object.assign({}, c); n[id] = (n[id] || 0) - 1; if (n[id] <= 0) delete n[id]; return n; }); }

// cart-ல எந்தெந்த restaurants-ன் items இருக்குதுன்னு கண்டுபிடிக்கறது
var cartRestaurantIds = Array.from(new Set(Object.keys(cart).map(function(id) {
var item = menu.filter(function(m) { return m.id === id; })[0];
return item ? item.restaurant_id : null;
}).filter(Boolean)));
var cartRestaurants = restaurants.filter(function(r) { return cartRestaurantIds.indexOf(r.id) !== -1; });

var [manualDistanceKm, setManualDistanceKm] = React.useState(2);
// ஒவ்வொரு cart restaurant-க்கும் customer-க்கும் இடையிலான தூரம் கணக்கிட்டு, மிக தூரமானதை எடுக்கிறோம்
var restaurantDistances = cartRestaurants.map(function(r) {
if (addressLatLng && r.latitude) {
return Math.max(0.5, Math.round(haversineKm(addressLatLng.lat, addressLatLng.lng, r.latitude, r.longitude) * 10) / 10);
}
return manualDistanceKm;
});
var maxDistanceKm = restaurantDistances.length ? Math.max.apply(null, restaurantDistances) : manualDistanceKm;
var extraShopsCount = Math.max(0, cartRestaurants.length - 1);

var cartCount = Object.values(cart).reduce(function(a, b) { return a + b; }, 0);
var cartTotal = Object.keys(cart).reduce(function(sum, id) {
var item = menu.filter(function(m) { return m.id === id; })[0];
return sum + (item ? item.price * cart[id] : 0);
}, 0);
var DELIVERY_RATE_PER_KM = 10;
var EXTRA_SHOP_FEE = 10;
var deliveryFee = Math.round(maxDistanceKm * DELIVERY_RATE_PER_KM) + (extraShopsCount * EXTRA_SHOP_FEE);
// Restaurant price-லேயே GST (food) already இருக்கு (5%) — அதனால Food subtotal-ல மறுபடி GST போடமாட்டோம்.
// இந்த GST rate, Delivery/Service fee மேல மட்டும் (18% platform service tax மாதிரி) apply ஆகும்.
var payableBeforeGst = cartTotal + deliveryFee;
var gstAmount = Math.round(deliveryFee * (gstRate / 100) * 100) / 100;
var grandTotal = payableBeforeGst + gstAmount;

var [paymentDone, setPaymentDone] = React.useState(false);
var [payBusy, setPayBusy] = React.useState(false);
var [rzpPaymentId, setRzpPaymentId] = React.useState(null);
var [rzpOrderId, setRzpOrderId] = React.useState(null);

var ADMIN_COMMISSION_RATE = adminCommissionRate / 100;
var DEFAULT_DEALER_RATE = 10;

function placeOrder() {
if (!addressId) { alert("Address தயார் ஆகல, ஒரு நிமிடம் காத்திருந்து try பண்ணுங்க"); return; }
if (cartRestaurantIds.length === 0) { alert("Cart காலியா இருக்கு"); return; }
setPlacing(true);

var adminCommission = Math.round(payableBeforeGst * ADMIN_COMMISSION_RATE * 100) / 100;
var dealerCommission = dealerId ? Math.round(payableBeforeGst * (dealerCommissionRate / 100) * 100) / 100 : 0;
var balance = payableBeforeGst - adminCommission - dealerCommission;
var totalRestaurantPayout = Math.round(balance * (cartTotal / payableBeforeGst) * 100) / 100;
var riderPayout = Math.round((balance - totalRestaurantPayout) * 100) / 100;

// ஒவ்வொரு restaurant-க்கும் அவங்க items subtotal-ஐ வச்சு payout பிரிக்கிறோம்
var perRestaurantSubtotal = {};
Object.keys(cart).forEach(function(id) {
var m = menu.filter(function(mm) { return mm.id === id; })[0];
if (!m) return;
perRestaurantSubtotal[m.restaurant_id] = (perRestaurantSubtotal[m.restaurant_id] || 0) + (m.price * cart[id]);
});

supabase.from("orders").insert({
customer_id: session.user.id, restaurant_id: cartRestaurantIds[0], restaurant_ids: cartRestaurantIds,
delivery_address_id: addressId, subtotal: cartTotal, delivery_fee: deliveryFee, gst_amount: gstAmount, status: "placed",
payment_status: paymentDone ? "paid" : "pending",
razorpay_order_id: rzpOrderId, razorpay_payment_id: rzpPaymentId,
dealer_id: dealerId,
dealer_commission_amount: dealerCommission,
admin_commission_amount: adminCommission,
restaurant_payout_amount: totalRestaurantPayout,
rider_payout_amount: riderPayout,
commission_amount: adminCommission + dealerCommission
}).select().then(function(res) {
if (res.error || !res.data || !res.data[0]) { alert("Order Error: " + (res.error ? res.error.message : "unknown")); setPlacing(false); return; }
var newOrder = res.data[0];
var items = Object.keys(cart).map(function(id) {
var m = menu.filter(function(mm) { return mm.id === id; })[0];
return { order_id: newOrder.id, restaurant_id: m.restaurant_id, menu_item_id: m.id, name_en: m.name_en, name_ta: m.name_ta, unit_price: m.price, quantity: cart[id] };
});
supabase.from("order_items").insert(items).then(function(ires) {
if (ires.error) { setPlacing(false); alert("Order items error: " + ires.error.message); return; }

// ஒவ்வொரு restaurant-க்கும் dealer-க்கும் payout record உருவாக்குறோம்
var payoutRows = [];
Object.keys(perRestaurantSubtotal).forEach(function(rid) {
var share = perRestaurantSubtotal[rid] / cartTotal;
payoutRows.push({ order_id: newOrder.id, recipient_type: 'restaurant', recipient_id: rid, amount: Math.round(totalRestaurantPayout * share * 100) / 100, status: 'pending' });
});
if (dealerId && dealerCommission > 0) {
payoutRows.push({ order_id: newOrder.id, recipient_type: 'dealer', recipient_id: dealerId, amount: dealerCommission, status: 'pending' });
}
supabase.from("payouts").insert(payoutRows).then(function() {
setPlacing(false);
setOrderId(newOrder.id);
setOrderStatus("placed");
setCart({});
setPaymentDone(false);
setRzpPaymentId(null);
setRzpOrderId(null);
setScreen('track');
});
});
});
}

var [trackRiderId, setTrackRiderId] = React.useState(null);
React.useEffect(function() {
if (!orderId) return;
var channel = supabase.channel('order-' + orderId)
.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: 'id=eq.' + orderId }, function(payload) {
setOrderStatus(payload.new.status);
if (payload.new.rider_id) setTrackRiderId(payload.new.rider_id);
}).subscribe();
supabase.from("orders").select("rider_id").eq("id", orderId).then(function(res) {
if (res.data && res.data[0] && res.data[0].rider_id) setTrackRiderId(res.data[0].rider_id);
});
return function() { supabase.removeChannel(channel); };
}, [orderId]);

if (screen === 'track') {
var stages = [
{ key: 'placed', ta: 'ஆர்டர் பதிவு' },
{ key: 'accepted', ta: 'ஏற்றுக்கொள்ளப்பட்டது' },
{ key: 'preparing', ta: 'தயார் செய்யப்படுகிறது' },
{ key: 'pickup', ta: 'எடுக்கப்பட்டது' },
{ key: 'onway', ta: 'வழியில் உள்ளது' },
{ key: 'delivered', ta: 'வழங்கப்பட்டது' }
];
var idx = stages.map(function(s){return s.key;}).indexOf(orderStatus);
return e('div', { style: { padding: 16 } },
e('p', { style: { fontWeight: 'bold', fontSize: 16 } }, 'ஆர்டர் #' + orderId + ' Tracking'),
e('div', { style: { background: 'white', borderRadius: 16, padding: 16, border: '1px solid #EEE0C8', marginTop: 12 } },
stages.map(function(s, i) {

(done ? '✅ ' : '⚪ ') + s.ta);
})
),
(restaurantLatLng || addressLatLng) ? e(TrackingMap, { restaurantLatLng: restaurantLatLng, addressLatLng: addressLatLng, riderId: trackRiderId }) : null,
e('button', { onClick: function(){ setScreen('menu'); }, style: { marginTop: 16, background: '#1C1410', color: 'white', padding: 10, borderRadius: 12, border: 'none', width: '100%' } }, 'மெனுவுக்கு திரும்பு')

addresses.map(function(a) {
var isActive = a.id === addressId;
return e('div', { key: a.id, onClick: function(){ selectAddress(a); },
style: { background: isActive ? '#1C1410' : 'white', color: isActive ? 'white' : '#1C1410', borderRadius: 14, padding: 14, border: '1px solid #EEE0C8', marginBottom: 10, cursor: 'pointer' } },
e('p', { style: { fontWeight: 700, fontSize: 14, margin: 0 } }, (isActive ? '✅ ' : '📍 ') + (a.label || 'Address')),

a.recipient_name ? e('p', { style: { fontSize: 11, color: isActive ? '#E8A33D' : '#C1442E', margin: '4px 0 0' } }, '👤 ' + a.recipient_name + (a.recipient_phone ? (' · ' + a.recipient_phone) : '')) : null
);
}),
!addrFormOpen ? e('button', { onClick: function(){ setAddrFormOpen(true); },

e('div', { style: { background: 'white', borderRadius: 14, padding: 14, border: '1px solid #EEE0C8', marginTop: 6 } },
e('p', { style: { fontWeight: 700, fontSize: 13, marginBottom: 10 } }, 'புது Delivery Address'),
e('label', { style: { fontSize: 11, color: '#8A6D3B' } }, 'Label (Home/Office/Amma வீடு)'),
e('input', { type: 'text', value: newLabel, onChange: function(ev){ setNewLabel(ev.target.value); },
style: { width: '100%', padding: 8, borderRadius: 10, border: '1px solid #EEE0C8', fontSize: 12, marginTop: 4, marginBottom: 10, boxSizing: 'border-box' } }),
e('label', { style: { fontSize: 11, color: '#8A6D3B' } }, 'யாருக்கு order (பெயர்) — வேறு ஒருவருக்கு ஆனா'),
e('input', { type: 'text', value: newRecipientName, placeholder: 'Optional', onChange: function(ev){ setNewRecipientName(ev.target.value); },
style: { width: '100%', padding: 8, borderRadius: 10, border: '1px solid #EEE0C8', fontSize: 12, marginTop: 4, marginBottom: 10, boxSizing: 'border-box' } }),

style: { width: '100%', padding: 8, borderRadius: 10, border: '1px solid #EEE0C8', fontSize: 12, marginTop: 4, marginBottom: 12, boxSizing: 'border-box' } }),
gpsErr ? e('p', { style: { fontSize: 11, color: '#C1442E', marginBottom: 8 } }, gpsErr) : null,
e('button', { onClick: function(){ captureLocation({ isNew: true }); }, disabled: gpsBusy,
style: { width: '100%', padding: 12, borderRadius: 12, border: 'none', background: '#1C1410', color: '#E8A33D', fontWeight: 700, marginBottom: 8 } },

e('button', { onClick: function(){ setAddrFormOpen(false); }, style: { width: '100%', padding: 8, borderRadius: 10, border: 'none', background: 'none', color: '#8A6D3B', fontSize: 12 } }, 'Cancel')
),
e('button', { onClick: function(){ setScreen('menu'); }, style: { marginTop: 16, background: 'white', color: '#1C1410', padding: 10, borderRadius: 12, border: '1px solid #EEE0C8', width: '100%' } }, '⬅ மெனுவுக்கு திரும்பு')
);
}

return e('div', { style: { minHeight: '100vh', paddingBottom: 220 } },
e('div', { style: { background: '#1C1410', color: 'white', padding: 16, display: 'flex', justifyContent: 'space-between' } },
e('div', null,
e('p', { style: { fontWeight: 'bold', margin: 0 } }, '🥚 Egg-Pro'),

),

),
e('div', { style: { padding: '12px 16px 0' } },

e('div', { style: { minWidth: 0, flex: 1 } },
e('p', { style: { fontSize: 10, color: '#8A6D3B', margin: 0 } }, '📍 Delivery Address'),
e('p', { style: { fontSize: 12, margin: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, addressText || 'இன்னும் set பண்ணல'),

),

'மாற்று')
)
),
e('div', { style: { padding: 16 } },
!addressPincode ? e('p', { style: { color: '#C9BBA8', textAlign: 'center', padding: 24 } }, 'முதல்ல 📍 Location set பண்ணுங்க — அப்போ தான் உங்க area-ல் restaurants காட்டுவோம்') :
loading ? e('p', null, 'Loading restaurants...') :
(dealerLookupDone && !dealerId) ? e('p', { style: { color: '#C1442E', textAlign: 'center', padding: 24 } }, 'இந்த pincode (' + addressPincode + ')-க்கு இன்னும் Dealer இணைக்கப்படல. சிறிது நேரம் கழித்து try பண்ணுங்க.') :
restaurants.length === 0 ? e('p', { style: { color: '#C9BBA8', textAlign: 'center', padding: 24 } }, 'இந்த area-ல் Restaurants இல்லை') :
restaurants.map(function(r) {
var rItems = menu.filter(function(m) { return m.restaurant_id === r.id; });
var inCart = cartRestaurantIds.indexOf(r.id) !== -1;
return e('div', { key: r.id, style: { marginBottom: 16 } },
e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
e('p', { style: { fontSize: 15, fontWeight: 700, margin: 0 } }, '🏪 ' + (r.name_ta || r.name)),
inCart ? e('span', { style: { fontSize: 11, fontWeight: 700, padding: '4px 10px', borderRadius: 20, background: '#1C1410', color: '#E8A33D' } }, '🛒 Cart-ல் இருக்கு') : null
),
rItems.length === 0 ? e('p', { style: { color: '#C9BBA8', fontSize: 12, padding: '0 4px' } }, 'மெனு காலியா இருக்கு') :
rItems.map(function(m) {
return e('div', { key: m.id, style: { background: 'white', borderRadius: 16, padding: 12, border: '1px solid #EEE0C8', marginBottom: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
e('div', null,
e('p', { style: { fontWeight: 600, fontSize: 14, margin: 0 } }, m.name_ta),
e('p', { style: { fontSize: 12, color: '#8A6D3B', margin: 0 } }, m.name_en + ' · ' + money(m.price))
),
cart[m.id] ? e('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
e('button', { onClick: function(){ removeItem(m.id); }, style: { width: 28, height: 28, borderRadius: 14, border: 'none', background: '#FFF6E8' } }, '−'),
e('span', null, cart[m.id]),
e('button', { onClick: function(){ addItem(m.id); }, style: { width: 28, height: 28, borderRadius: 14, border: 'none', background: '#FFF6E8' } }, '+')
) : e('button', { onClick: function(){ addItem(m.id); }, style: { width: 32, height: 32, borderRadius: 16, border: 'none', background: '#1C1410', color: '#E8A33D' } }, '+')
);
})
);
})
),
cartCount > 0 ? e('div', { style: { position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', borderTop: '1px solid #EEE0C8', padding: 16, boxShadow: '0 -4px 16px rgba(0,0,0,0.08)' } },
e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 } },
e('span', { style: { fontSize: 13, color: '#8A6D3B' } }, '📍 தூரம் (Distance)'),
addressLatLng ? e('span', { style: { fontWeight: 600, fontSize: 13, color: '#5B7553' } }, maxDistanceKm + ' km (GPS)') :
e('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
e('button', { onClick: function(){ setManualDistanceKm(Math.max(1, manualDistanceKm - 1)); }, style: { width: 26, height: 26, borderRadius: 13, border: 'none', background: '#F3E9D8' } }, '−'),
e('span', { style: { fontWeight: 600, fontSize: 13, minWidth: 60, textAlign: 'center' } }, maxDistanceKm + ' km (est)'),
e('button', { onClick: function(){ setManualDistanceKm(manualDistanceKm + 1); }, style: { width: 26, height: 26, borderRadius: 13, border: 'none', background: '#F3E9D8' } }, '+')
)
),
cartRestaurants.length > 1 ? e('div', { style: { fontSize: 11, color: '#8A6D3B', marginBottom: 6 } }, '🏪 ' + cartRestaurants.length + ' கடைகளில் இருந்து order (+₹' + (extraShopsCount * EXTRA_SHOP_FEE) + ' கூடுதல் shop fee)') : null,
e('div', { style: { fontSize: 12, color: '#8A6D3B', marginBottom: 2, display: 'flex', justifyContent: 'space-between' } },
e('span', null, 'உணவு மொத்தம்'), e('span', null, money(cartTotal))
),
e('div', { style: { fontSize: 12, color: '#8A6D3B', marginBottom: 8, display: 'flex', justifyContent: 'space-between' } },
e('span', null, 'டெலிவரி கட்டணம்'), e('span', null, money(deliveryFee))
),
gstRate > 0 ? e('div', { style: { fontSize: 12, color: '#8A6D3B', marginBottom: 8, display: 'flex', justifyContent: 'space-between' } },
e('span', null, 'GST (' + gstRate + '% Delivery மேல)'), e('span', null, money(gstAmount))
) : null,
e('div', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10, display: 'flex', justifyContent: 'space-between', borderTop: '1px dashed #EEE0C8', paddingTop: 8 } },
e('span', null, 'மொத்த விலை'), e('span', null, money(grandTotal))
),
!paymentDone ? e('div', null,
e('button', { onClick: startPayment, disabled: payBusy,
style: { width: '100%', background: '#5B7553', color: 'white', padding: 12, borderRadius: 14, border: 'none', fontWeight: 600, marginBottom: 8 } },
payBusy ? '⏳ Payment window திறக்குது...' : '💳 ' + money(grandTotal) + ' Pay பண்ணுங்க')
) : e('div', null,
e('p', { style: { fontSize: 12, color: '#5B7553', textAlign: 'center', marginBottom: 8, fontWeight: 600 } }, '✅ Payment வெற்றிகரமாக verify ஆனது'),
e('button', { onClick: placeOrder, disabled: placing || !addressId || !addressLatLng,
style: { width: '100%', background: (!addressId || !addressLatLng ? '#C9BBA8' : '#1C1410'), color: 'white', padding: 14, borderRadius: 16, border: 'none', fontWeight: 600 } },
!addressLatLng ? '📍 மேலே Location set பண்ணுங்க' : placing ? 'Placing order...' : (cartCount + ' items · ' + money(grandTotal) + ' · Order செய்')
)
)
) : null,
e('div', { style: { textAlign: 'center', padding: '18px 16px 90px' } },
e('a', { href: 'legal/index.html', style: { fontSize: 11, color: '#8A6D3B', textDecoration: 'underline' } }, 'Terms · Privacy · Refund Policy')
)
);
}

function App() {
var [session, setSession] = React.useState(null);
var [checked, setChecked] = React.useState(false);
React.useEffect(function() {
supabase.auth.getSession().then(function(res) { setSession(res.data.session); setChecked(true); });
supabase.auth.onAuthStateChange(function(event, sess) { setSession(sess); });
}, []);
if (!checked) return e('p', { style: { textAlign: 'center', padding: 40, color: '#8A6D3B' } }, 'Loading...');
return session ? e(CustomerHome, { session: session }) : e(Login);
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
