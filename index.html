e('p', { style: { fontSize: 12, color: '#8A6D3B', margin: 0 } }, 'Page ' + (page+1) + ' / ' + pageCount),
e('button', { onClick: function(){ setPage(Math.min(pageCount - 1, page + 1)); }, disabled: page >= pageCount - 1,
style: { padding: '8px 14px', borderRadius: 10, border: '1px solid #EEE0C8', background: 'white', fontSize: 12 } }, 'அடுத்தது ➡')
) : null
);
}

function PayoutsTab() {
var [payouts, setPayouts] = React.useState([]);
var [names, setNames] = React.useState({ restaurant: {}, rider: {}, dealer: {} });
var [loading, setLoading] = React.useState(true);
var [filter, setFilter] = React.useState('pending');

function load() {
setLoading(true);
Promise.all([
supabase.from("payouts").select("*").order("created_at", { ascending: false }),
supabase.from("restaurants").select("id,name,name_ta"),
supabase.from("riders").select("id,name"),
supabase.from("dealers").select("id,name")
]).then(function(results) {
var pRes = results[0], rRes = results[1], riderRes = results[2], dRes = results[3];
setPayouts(pRes.data || []);
var nm = { restaurant: {}, rider: {}, dealer: {} };
(rRes.data || []).forEach(function(r) { nm.restaurant[r.id] = r.name_ta || r.name; });
(riderRes.data || []).forEach(function(r) { nm.rider[r.id] = r.name; });
(dRes.data || []).forEach(function(d) { nm.dealer[d.id] = d.name; });
setNames(nm);
setLoading(false);
});
}
React.useEffect(load, []);

function nameFor(type, id) { return (names[type] && names[type][id]) || ('(' + type + ' #' + String(id||'').slice(0,6) + ')'); }

function markGroupPaid(type, id) {
if (!confirm('இந்த amount பணமா அனுப்பியாச்சான்னு confirm பண்ணுறீங்களா?')) return;
supabase.from("payouts").update({ status: 'paid', paid_at: new Date().toISOString() })
.eq("recipient_type", type).eq("recipient_id", id).eq("status", "pending").then(function(res) {
if (res.error) { alert("Error: " + res.error.message); return; }
load();
});
}

var filtered = payouts.filter(function(p) { return filter === 'all' || p.status === filter; });
var groups = {};
filtered.forEach(function(p) {
var key = p.recipient_type + '_' + p.recipient_id;
if (!groups[key]) groups[key] = { type: p.recipient_type, id: p.recipient_id, total: 0, count: 0, status: p.status };
groups[key].total += Number(p.amount);
groups[key].count += 1;
});
var groupList = Object.values(groups).sort(function(a, b) { return b.total - a.total; });
var totalPending = payouts.filter(function(p){ return p.status === 'pending'; }).reduce(function(s,p){ return s + Number(p.amount); }, 0);
var iconFor = { restaurant: '🏪', rider: '🏍️', dealer: '🤝' };

if (loading) return e('p', { style: { padding: 16, textAlign: 'center', color: '#8A6D3B' } }, 'Loading...');

return e('div', { style: { padding: 16 } },
e('div', { style: { display: 'flex', gap: 10, marginBottom: 12 } },
e(StatCard, { label: 'மொத்த Pending', value: money(totalPending) })
),
e('div', { style: { display: 'flex', gap: 8, marginBottom: 12 } },
['pending','paid','all'].map(function(f) {
var labels = { pending: '⏳ Pending', paid: '✅ Paid', all: 'எல்லாம்' };
return e('button', { key: f, onClick: function(){ setFilter(f); },
style: { flex: 1, padding: '8px 4px', fontSize: 12, borderRadius: 10, border: '1px solid #EEE0C8',
background: filter === f ? '#1C1410' : 'white', color: filter === f ? '#E8A33D' : '#8A6D3B', fontWeight: 600 } }, labels[f]);
})
),
groupList.length === 0 ? e('p', { style: { color: '#C9BBA8', textAlign: 'center', padding: 20 } }, 'Payouts இல்லை') :
groupList.map(function(g) {
return e('div', { key: g.type + '_' + g.id, style: { background: 'white', borderRadius: 14, padding: 12, border: '1px solid #EEE0C8', marginBottom: 8 } },
e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
e('div', null,
e('p', { style: { fontWeight: 700, fontSize: 14, margin: 0 } }, iconFor[g.type] + ' ' + nameFor(g.type, g.id)),
e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, g.count + ' orders · ' + g.type)
),
e('p', { style: { fontWeight: 700, fontSize: 16, margin: 0, color: g.status === 'pending' ? '#C1442E' : '#5B7553' } }, money(g.total))
),
filter === 'pending' ? e('button', { onClick: function(){ markGroupPaid(g.type, g.id); },
style: { width: '100%', marginTop: 8, padding: 8, borderRadius: 10, border: 'none', background: '#5B7553', color: 'white', fontSize: 12, fontWeight: 600 } }, '✅ Paid ஆனது Mark பண்ணுங்க') : null
);
})
);
}

function AdminHome(props) {
var [tab, setTab] = React.useState('dashboard');
var tabs = [
{ key: 'dashboard', label: '📊 Dashboard' },
{ key: 'orders', label: '📦 Orders' },
{ key: 'restaurants', label: '🏪 Restaurants' },
{ key: 'riders', label: '🏍️ Riders' },
{ key: 'dealers', label: '🤝 Dealers' },
{ key: 'pincodes', label: '📍 Pincodes' },
{ key: 'payouts', label: '💰 Payouts' }
];
return e('div', { style: { minHeight: '100vh', paddingBottom: 70 } },
e('div', { style: { background: '#1C1410', color: 'white', padding: 16, display: 'flex', justifyContent: 'space-between' } },
e('div', null,
e('p', { style: { fontWeight: 'bold', margin: 0 } }, '🛠️ Egg-Pro Admin'),
e('p', { style: { fontSize: 11, color: '#E8A33D', margin: 0 } }, 'கண்காணிப்பு')
),
e('button', { onClick: function(){ supabase.auth.signOut(); }, style: { color: '#C9BBA8', background: 'none', border: 'none' } }, '⎋')
),
tab === 'dashboard' ? e(Dashboard) :
tab === 'orders' ? e(OrdersTab) :
tab === 'restaurants' ? e(RestaurantsTab) :
tab === 'riders' ? e(RidersTab) :
tab === 'dealers' ? e(DealersTab) :
tab === 'pincodes' ? e(PincodesTab) :
e(PayoutsTab),
e('div', { style: { position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', borderTop: '1px solid #EEE0C8', display: 'flex' } },
tabs.map(function(t) {
return e('button', { key: t.key, onClick: function(){ setTab(t.key); },
style: { flex: 1, padding: '10px 4px', border: 'none', background: 'none', fontSize: 10,
color: tab === t.key ? '#1C1410' : '#C9BBA8', fontWeight: tab === t.key ? 700 : 400 } }, t.label);
})
)
);
}

function App() {
var [session, setSession] = React.useState(null);
var [checked, setChecked] = React.useState(false);
React.useEffect(function() {
supabase.auth.getSession().then(function(res) { setSession(res.data.session); setChecked(true); });
supabase.auth.onAuthStateChange(function(event, sess) { setSession(sess); });
}, []);
if (!checked) return e('p', { style: { textAlign: 'center', padding: 40, color: '#8A6D3B' } }, 'Loading...');
return session ? e(AdminHome, { session: session }) : e(Login);
}

class ErrorBoundary extends React.Component {
constructor(props) { super(props); this.state = { error: null }; }
static getDerivedStateFromError(error) { return { error: error }; }
componentDidCatch(error, info) { console.error("Admin app crash:", error, info); }
render() {
if (this.state.error) {
return e('div', { style: { padding: 24, fontFamily: 'sans-serif' } },
e('p', { style: { fontWeight: 'bold', color: '#C1442E' } }, '⚠️ App Error:'),
e('p', { style: { fontSize: 13, color: '#666', wordBreak: 'break-word' } }, String(this.state.error && this.state.error.message || this.state.error)),
e('button', { onClick: function(){ location.reload(); }, style: { marginTop: 12, padding: '10px 16px', background: '#1C1410', color: '#E8A33D', border: 'none', borderRadius: 8 } }, '🔄 மறுபடி Try பண்ணுங்க')
);
}
return this.props.children;
}
}

ReactDOM.createRoot(document.getElementById('root')).render(e(ErrorBoundary, null, e(App)));
</script>
</body>
</html>
