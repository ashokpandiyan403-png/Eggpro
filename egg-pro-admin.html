<!doctype html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Egg-Pro — Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Baloo+Thambi+2:wght@500;600;700&display=swap');
  body { font-family: 'Poppins', 'Noto Sans Tamil', sans-serif; }
</style>
</head>
<body class="bg-[#FBF3E7]">
<div id="root">Loading...</div>

<script>
// ============ NO BABEL, NO JSX — plain JavaScript only ============
// This avoids the slow in-browser compile step that was crashing on mobile.

var e = React.createElement;

var SUPABASE_URL = "https://ikcmtuoldgrfzptkszyb.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_2b9pYw5utOjohoQbZ_RIOQ__nzh67OR";
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function money(n) { return "₹" + Number(n || 0).toFixed(2); }

// ---------- Login Component ----------
function Login(props) {
  var [email, setEmail] = React.useState("");
  var [password, setPassword] = React.useState("");
  var [err, setErr] = React.useState("");
  var [loading, setLoading] = React.useState(false);

  function handleLogin(ev) {
    ev.preventDefault();
    setLoading(true);
    setErr("");
    supabase.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
      if (res.error) setErr(res.error.message);
      setLoading(false);
    });
  }

  return e('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 } },
    e('form', { onSubmit: handleLogin, style: { width: '100%', maxWidth: 384, background: 'white', borderRadius: 16, padding: 24, border: '1px solid #EEE0C8' } },
      e('div', { style: { display: 'flex', gap: 8, marginBottom: 24, alignItems: 'center' } },
        e('div', { style: { width: 36, height: 36, borderRadius: 18, background: '#1C1410', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#E8A33D' } }, '🛡️'),
        e('div', null,
          e('p', { style: { fontWeight: 'bold', color: '#1C1410', margin: 0 } }, 'Admin Panel'),
          e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, 'Egg-Pro')
        )
      ),
      e('input', { type: 'email', placeholder: 'Email', required: true, value: email, onChange: function(ev){ setEmail(ev.target.value); },
        style: { width: '100%', marginBottom: 12, padding: '10px 12px', borderRadius: 12, border: '1px solid #EEE0C8', fontSize: 14, boxSizing: 'border-box' } }),
      e('input', { type: 'password', placeholder: 'Password', required: true, value: password, onChange: function(ev){ setPassword(ev.target.value); },
        style: { width: '100%', marginBottom: 16, padding: '10px 12px', borderRadius: 12, border: '1px solid #EEE0C8', fontSize: 14, boxSizing: 'border-box' } }),
      err ? e('p', { style: { fontSize: 12, color: '#C1442E', marginBottom: 12 } }, err) : null,
      e('button', { type: 'submit', disabled: loading,
        style: { width: '100%', background: '#1C1410', color: 'white', fontWeight: 600, fontSize: 14, padding: 12, borderRadius: 12, border: 'none' } },
        loading ? '...' : 'Login')
    )
  );
}

// ---------- Dashboard Component ----------
function Dashboard(props) {
  var [orders, setOrders] = React.useState([]);
  var [restaurants, setRestaurants] = React.useState([]);
  var [loading, setLoading] = React.useState(true);
  var [dbError, setDbError] = React.useState("");

  React.useEffect(function() {
    Promise.all([
      supabase.from("orders").select("*, restaurants(name)").order("placed_at", { ascending: false }).limit(50),
      supabase.from("restaurants").select("*")
    ]).then(function(results) {
      if (results[0].error) setDbError(results[0].error.message);
      else setOrders(results[0].data || []);
      if (results[1].error) setDbError(results[1].error.message);
      else setRestaurants(results[1].data || []);
      setLoading(false);
    });
  }, []);

  var totalCommission = orders.reduce(function(sum, o) { return sum + Number(o.commission_amount || 0); }, 0);
  var todayStr = new Date().toDateString();
  var todayCommission = orders.reduce(function(sum, o) {
    return sum + (o.placed_at && new Date(o.placed_at).toDateString() === todayStr ? Number(o.commission_amount || 0) : 0);
  }, 0);

  return e('div', { style: { minHeight: '100vh', paddingBottom: 32 } },
    e('div', { style: { background: '#1C1410', color: 'white', padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
      e('div', null,
        e('p', { style: { fontWeight: 'bold', margin: 0 } }, 'Egg-Pro'),
        e('p', { style: { fontSize: 11, color: '#E8A33D', margin: 0 } }, 'Admin Dashboard')
      ),
      e('button', { onClick: function(){ supabase.auth.signOut(); }, style: { color: '#C9BBA8', background: 'none', border: 'none' } }, '⎋ Logout')
    ),
    e('div', { style: { padding: 16 } },
      loading ? e('p', { style: { color: '#8A6D3B' } }, 'Loading data...') :
      dbError ? e('p', { style: { color: '#C1442E' } }, 'Error: ' + dbError) :
      e('div', null,
        e('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 } },
          e('div', { style: { background: 'white', borderRadius: 16, padding: 16, border: '1px solid #EEE0C8' } },
            e('p', { style: { fontSize: 20, fontWeight: 'bold', color: '#1C1410', margin: 0 } }, orders.length),
            e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, 'Total Orders')
          ),
          e('div', { style: { background: 'white', borderRadius: 16, padding: 16, border: '1px solid #EEE0C8' } },
            e('p', { style: { fontSize: 20, fontWeight: 'bold', color: '#1C1410', margin: 0 } }, restaurants.length),
            e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, 'Restaurants')
          )
        ),
        e('div', { style: { background: '#1C1410', borderRadius: 16, padding: 16, marginBottom: 16 } },
          e('p', { style: { fontSize: 11, color: '#C9BBA8', margin: 0 } }, '💰 மொத்த Commission (4.3%)'),
          e('p', { style: { fontSize: 26, fontWeight: 'bold', color: '#E8A33D', margin: '4px 0' } }, money(totalCommission)),
          e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, 'இன்று: ' + money(todayCommission))
        ),
        e('div', { style: { background: 'white', borderRadius: 16, border: '1px solid #EEE0C8', overflow: 'hidden' } },
          orders.length === 0 ?
            e('p', { style: { textAlign: 'center', color: '#C9BBA8', padding: 24 } }, 'ஆர்டர்கள் இல்லை') :
            orders.map(function(o) {
              return e('div', { key: o.id, style: { padding: '12px 16px', borderBottom: '1px solid #F3E9D8', display: 'flex', justifyContent: 'space-between' } },
                e('span', null, '#' + o.id + ' · ' + (o.restaurants ? o.restaurants.name : '')),
                e('div', { style: { textAlign: 'right' } },
                  e('p', { style: { fontWeight: 'bold', margin: 0, fontSize: 13 } }, money(o.total_amount)),
                  e('p', { style: { fontSize: 10, color: '#5B7553', margin: 0 } }, 'commission: ' + money(o.commission_amount))
                )
              );
            })
        )
      )
    )
  );
}

// ---------- Root App ----------
function App() {
  var [session, setSession] = React.useState(null);
  var [checked, setChecked] = React.useState(false);

  React.useEffect(function() {
    supabase.auth.getSession().then(function(res) {
      setSession(res.data.session);
      setChecked(true);
    });
    var sub = supabase.auth.onAuthStateChange(function(event, sess) {
      setSession(sess);
    });
  }, []);

  if (!checked) return e('p', { style: { textAlign: 'center', padding: 40, color: '#8A6D3B' } }, 'Loading...');
  return session ? e(Dashboard) : e(Login);
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
