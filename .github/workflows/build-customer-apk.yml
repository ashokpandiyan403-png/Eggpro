name: Build EggPro Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-conversion

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp egg-pro-customer.html www/index.html

      - name: Initialize npm
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/geolocation@7
          npm install -D @capacitor/cli@7

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.eggpro.customer",
            "appName": "EggPro Customer",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android Location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          location_permissions = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in s:
              s = s.replace(
                  "<application",
                  location_permissions + "\n    <application",
                  1
              )

          p.write_text(s)
          print("Location permissions added successfully.")
          PY

      - name: Create EggPro icon
        run: |
          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/eggpro_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,8 C32,8 20,31 20,51 C20,77 34,96 54,96 C74,96 88,77 88,51 C88,31 76,8 54,8 Z"/>

              <path
                  android:fillColor="#E8A33D"
                  android:pathData="M54,30 C43,30 36,39 36,50 C36,61 43,68 54,68 C65,68 72,61 72,50 C72,39 65,30 54,30 Z"/>

              <path
                  android:fillColor="#C1442E"
                  android:pathData="M28,75 C35,83 44,87 54,87 C64,87 73,83 80,75 C73,91 64,98 54,98 C44,98 35,91 28,75 Z"/>
          </vector>
          EOF

      - name: Set EggPro launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/eggpro_icon"',
              s,
              count=1
          )

          p.write_text(s)
          print("EggPro launcher icon configured.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android Manifest
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml
          echo "================================"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EggPro-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk