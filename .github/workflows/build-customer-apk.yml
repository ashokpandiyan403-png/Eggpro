name: Build EggPro Customer APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-conversion

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp egg-pro-customer.html www/index.html

          npm init -y

          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7
          npm install -D typescript

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.eggpro.customer',
            appName: 'EggPro Customer',
            webDir: 'www',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EggPro-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk