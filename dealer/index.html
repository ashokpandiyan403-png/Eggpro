<!doctype html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Egg-Pro — Dealer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Baloo+Thambi+2:wght@500;600;700&display=swap');
body { font-family: 'Poppins', 'Noto Sans Tamil', sans-serif; margin: 0; background:#FBF3E7; }
</style>
</head>
<body>
<div id="root">Loading...</div>
<script>
(function() {
var missing = [];
if (typeof React === 'undefined') missing.push('React library');
if (typeof ReactDOM === 'undefined') missing.push('ReactDOM library');
if (typeof window.supabase === 'undefined') missing.push('Supabase library');
if (missing.length > 0) {
document.getElementById('root').innerHTML =
'<div style="padding:24px;font-family:sans-serif;">' +
'<p style="font-weight:bold;color:#C1442E;">⚠️ Load ஆகல: ' + missing.join(', ') + '</p>' +
'<p style="font-size:13px;color:#666;">Internet connection சரி பாருங்க, அல்லது வேற browser/network-ல் try பண்ணுங்க.</p>' +
'<button onclick="location.reload()" style="margin-top:12px;padding:10px 16px;background:#1C1410;color:#E8A33D;border:none;border-radius:8px;">🔄 மறுபடி Try பண்ணுங்க</button>' +
'</div>';
throw new Error('Missing dependencies: ' + missing.join(', '));
}
})();
window.addEventListener('error', function(ev) {
var rootEl = document.getElementById('root');
if (rootEl && rootEl.innerHTML.indexOf('Loading') !== -1) {
rootEl.innerHTML = '<div style="padding:24px;font-family:sans-serif;">' +
'<p style="font-weight:bold;color:#C1442E;">⚠️ Error: ' + (ev.message || 'Unknown error') + '</p>' +
'<button onclick="location.reload()" style="margin-top:12px;padding:10px 16px;background:#1C1410;color:#E8A33D;border:none;border-radius:8px;">🔄 மறுபடி Try பண்ணுங்க</button>' +
'</div>';
}
});
var e = React.createElement;
var SUPABASE_URL = "https://ikcmtuoldgrfzptkszyb.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_2b9pYw5utOjohoQbZ_RIOQ__nzh67OR";
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function money(n) { return "₹" + Number(n || 0).toFixed(2); }
function fmtDate(s) { if(!s) return ""; var d = new Date(s); return d.toLocaleDateString('en-IN', {day:'2-digit',month:'short'}) + " " + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function shortId(x) { return String(x||'').slice(0,8); }

var STATUS_TA = { placed:'பதிவு', accepted:'ஏற்றது', preparing:'தயார்', pickup:'எடுத்தது', onway:'வழியில்', delivered:'வழங்கியது', cancelled:'ரத்து' };

function Login() {
var [email, setEmail] = React.useState("");
var [password, setPassword] = React.useState("");
var [err, setErr] = React.useState("");
var [loading, setLoading] = React.useState(false);

function submit(ev) {
ev.preventDefault();
setLoading(true); setErr("");
supabase.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
if (res.error) { setErr(res.error.message); setLoading(false); return; }
supabase.from("profiles").select("role, dealer_id").eq("id", res.data.user.id).then(function(pres) {
setLoading(false);
var prof = pres.data && pres.data[0];
if (!prof || prof.role !== "dealer") {
setErr("இந்த account-க்கு Dealer அனுமதி இல்லை");
supabase.auth.signOut();
} else if (!prof.dealer_id) {
setErr("இந்த account-க்கு Dealer profile link ஆகல. Admin-ஐ தொடர்பு கொள்ளுங்க.");
supabase.auth.signOut();
}
});
});
}

return e('div', { style: { minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 } },
e('form', { onSubmit: submit, style: { width: '100%', maxWidth: 384, background: 'white', borderRadius: 16, padding: 24, border: '1px solid #EEE0C8' } },
e('div', { style: { display: 'flex', gap: 8, marginBottom: 24, alignItems: 'center' } },
e('div', { style: { width: 36, height: 36, borderRadius: 18, background: '#E8A33D', display: 'flex', alignItems: 'center', justifyContent: 'center' } }, '🤝'),
e('div', null,
e('p', { style: { fontWeight: 'bold', color: '#1C1410', margin: 0 } }, 'Egg-Pro Dealer'),
e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, 'Login')
)
),
e('input', { type: 'email', placeholder: 'Email', required: true, value: email, onChange: function(ev){ setEmail(ev.target.value); },
style: { width: '100%', marginBottom: 12, padding: '10px 12px', borderRadius: 12, border: '1px solid #EEE0C8', fontSize: 14, boxSizing: 'border-box' } }),
e('input', { type: 'password', placeholder: 'Password', required: true, value: password, onChange: function(ev){ setPassword(ev.target.value); },
style: { width: '100%', marginBottom: 16, padding: '10px 12px', borderRadius: 12, border: '1px solid #EEE0C8', fontSize: 14, boxSizing: 'border-box' } }),
err ? e('p', { style: { fontSize: 12, color: '#C1442E', marginBottom: 12 } }, err) : null,
e('button', { type: 'submit', disabled: loading,
style: { width: '100%', background: '#C1442E', color: 'white', fontWeight: 600, fontSize: 14, padding: 12, borderRadius: 12, border: 'none' } },
loading ? '...' : 'Login')
)
);
}

function StatCard(props) {
return e('div', { style: { background: 'white', borderRadius: 14, padding: 14, border: '1px solid #EEE0C8', flex: 1, minWidth: 130 } },
e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: '0 0 4px' } }, props.label),
e('p', { style: { fontSize: 20, fontWeight: 700, margin: 0, color: '#1C1410' } }, props.value)
);
}

function DealerHome(props) {
var dealerId = props.dealerId;
var [dealer, setDealer] = React.useState(null);
var [orders, setOrders] = React.useState([]);
var [loading, setLoading] = React.useState(true);

function load() {
supabase.from("dealers").select("*").eq("id", dealerId).then(function(res) {
setDealer(res.data && res.data[0]);
});
supabase.from("orders").select("*").eq("dealer_id", dealerId).order("created_at", { ascending: false }).then(function(res) {
setOrders(res.data || []); setLoading(false);
});
}
React.useEffect(function() {
load();
var channel = supabase.channel('dealer-orders-' + dealerId)
.on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: 'dealer_id=eq.' + dealerId }, function() { load(); }).subscribe();
return function() { supabase.removeChannel(channel); };
}, []);

if (loading) return e('p', { style: { padding: 40, textAlign: 'center', color: '#8A6D3B' } }, 'Loading...');

var totalOrders = orders.length;
var totalEarnings = orders.reduce(function(s,o){ return s + Number(o.dealer_commission_amount||0); }, 0);
var thisMonth = orders.filter(function(o) {
if (!o.created_at) return false;
var d = new Date(o.created_at); var now = new Date();
return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
});
var monthEarnings = thisMonth.reduce(function(s,o){ return s + Number(o.dealer_commission_amount||0); }, 0);
var recent = orders.slice(0, 15);

return e('div', { style: { minHeight: '100vh', paddingBottom: 24 } },
e('div', { style: { background: '#1C1410', color: 'white', padding: 16, display: 'flex', justifyContent: 'space-between' } },
e('div', null,
e('p', { style: { fontWeight: 'bold', margin: 0 } }, '🤝 Egg-Pro Dealer'),
e('p', { style: { fontSize: 11, color: '#E8A33D', margin: 0 } }, dealer ? dealer.name : '')
),
e('button', { onClick: function(){ supabase.auth.signOut(); }, style: { color: '#C9BBA8', background: 'none', border: 'none' } }, '⎋')
),
e('div', { style: { padding: 16 } },
dealer ? e('div', { style: { background: 'white', borderRadius: 14, padding: 14, border: '1px solid #EEE0C8', marginBottom: 14 } },
e('p', { style: { fontSize: 12, color: '#8A6D3B', margin: '0 0 4px' } }, 'உங்க Commission Rate'),
e('p', { style: { fontSize: 18, fontWeight: 700, margin: '0 0 8px' } }, dealer.commission_rate + '%'),
e('p', { style: { fontSize: 12, color: '#8A6D3B', margin: '0 0 4px' } }, 'உங்க Area Pincodes'),
e('p', { style: { fontSize: 13, fontWeight: 600, margin: 0 } }, (dealer.area_pincodes || []).join(', ') || 'ஒதுக்கப்படவில்லை'),
e('p', { style: { fontSize: 11, color: dealer.is_active ? '#5B7553' : '#C1442E', margin: '8px 0 0' } }, dealer.is_active ? '✅ Active' : '❌ Inactive')
) : null,

e('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 16 } },
e(StatCard, { label: 'மொத்த Orders', value: totalOrders }),
e(StatCard, { label: 'மொத்த சம்பாத்தியம்', value: money(totalEarnings) }),
e(StatCard, { label: 'இந்த மாத Orders', value: thisMonth.length }),
e(StatCard, { label: 'இந்த மாத சம்பாத்தியம்', value: money(monthEarnings) })
),

e('p', { style: { fontWeight: 600, fontSize: 14, margin: '4px 0 8px' } }, '📦 சமீபத்திய Orders'),
recent.length === 0 ? e('p', { style: { color: '#C9BBA8', textAlign: 'center', padding: 20 } }, 'இன்னும் orders இல்லை') :
recent.map(function(o) {
return e('div', { key: o.id, style: { background: 'white', borderRadius: 12, padding: 12, border: '1px solid #EEE0C8', marginBottom: 8, display: 'flex', justifyContent: 'space-between' } },
e('div', null,
e('p', { style: { fontSize: 13, fontWeight: 600, margin: 0 } }, '#' + shortId(o.id)),
e('p', { style: { fontSize: 11, color: '#8A6D3B', margin: 0 } }, fmtDate(o.created_at)),
e('p', { style: { fontSize: 11, color: '#5B7553', margin: 0 } }, STATUS_TA[o.status] || o.status)
),
e('p', { style: { fontSize: 13, fontWeight: 700, margin: 0, color: '#5B7553' } }, '+' + money(o.dealer_commission_amount))
);
})
)
);
}

function App() {
var [session, setSession] = React.useState(null);
var [dealerId, setDealerId] = React.useState(null);
var [checked, setChecked] = React.useState(false);

function loadProfile(sess) {
if (!sess) { setDealerId(null); return; }
supabase.from("profiles").select("dealer_id, role").eq("id", sess.user.id).then(function(pres) {
var prof = pres.data && pres.data[0];
if (prof && prof.role === 'dealer') setDealerId(prof.dealer_id);
});
}

React.useEffect(function() {
supabase.auth.getSession().then(function(res) {
var sess = res.data.session;
setSession(sess);
if (sess) { loadProfile(sess); setChecked(true); } else { setChecked(true); }
});
supabase.auth.onAuthStateChange(function(event, sess) {
setSession(sess);
loadProfile(sess);
});
}, []);

if (!checked) return e('p', { style: { textAlign: 'center', padding: 40, color: '#8A6D3B' } }, 'Loading...');
return (session && dealerId) ? e(DealerHome, { dealerId: dealerId }) : e(Login);
}

class ErrorBoundary extends React.Component {
constructor(props) { super(props); this.state = { error: null }; }
static getDerivedStateFromError(error) { return { error: error }; }
componentDidCatch(error, info) { console.error("Dealer app crash:", error, info); }
render() {
if (this.state.error) {
return e('div', { style: { padding: 24, fontFamily: 'sans-serif' } },
e('p', { style: { fontWeight: 'bold', color: '#C1442E' } }, '⚠️ App Error:'),
e('p', { style: { fontSize: 13, color: '#666', wordBreak: 'break-word' } }, String(this.state.error && this.state.error.message || this.state.error)),
e('button', { onClick: function(){ location.reload(); }, style: { marginTop: 12, padding: '10px 16px', background: '#1C1410', color: '#E8A33D', border: 'none', borderRadius: 8 } }, '🔄 மறுபடி Try பண்ணுங்க')
);
}
return this.props.children;
}
}

ReactDOM.createRoot(document.getElementById('root')).render(e(ErrorBoundary, null, e(App)));
</script>
</body>
</html>
